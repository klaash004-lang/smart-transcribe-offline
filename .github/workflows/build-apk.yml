
name: Build Smart Transcribe APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project ZIP
        run: |
          unzip -q Smart-Transcribe-Offline-Android-v1.0.1-source.zip -d extracted
          test -f extracted/Smart-Transcribe-Offline-Android/settings.gradle.kts

      - name: Build APK
        run: |
          gradle --no-daemon -p extracted/Smart-Transcribe-Offline-Android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Transcribe-Offline-APK
          path: extracted/Smart-Transcribe-Offline-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
